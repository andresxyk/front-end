
# Checkstyle
maven.checkstyle.properties=${basedir}/web2lab_checks.xml
maven.checkstyle.excludes=

# Changelog
maven.changelog.range   = 30
maven.activitylog.range = 30

# HttpUnit.
maven.junit.fork=yes
maven.junit.sysproperties=httpunit.test.url
httpunit.test.url=http://localhost:8020/web2labportal

#nombre final de la aplicacion
maven.final.name=web2labportal

#---------------------------------------
#SOLO APLICA PARA LA SEGURIDAD DE TURBINE
#---------------------------------------
torque.project = web2labportal
torque.database = oracle
torque.contextProperties = project.properties
torque.runOnlyOnSchemaChange = false

torque.schema.dir = src/schema
torque.sql.dir = target/sql
torque.java.dir = src/java
torque.doc.dir = xdocs/schema
#torque.lib.dir = ${maven.repo.local}
torque.doc.format = anakia

torque.addGetByNameMethod = false
torque.addTimeStamp = false
torque.addIntakeRetrievable = true
torque.useManagers = false
torque.useClasspath = true
torque.complexObjectModel=true
torque.basePrefix=Base
torque.retrievableInterface = org.apache.turbine.om.Retrievable


