log4j.appender.org.apache.torque.append= false
log4j.appender.org.apache.torque.file= ${torque.applicationRoot}/logs/torque.log
log4j.appender.org.apache.torque.layout.conversionPattern= %d [%t] %-5p %c - %m%n
log4j.appender.org.apache.torque.layout= org.apache.log4j.PatternLayout
log4j.appender.org.apache.torque= org.apache.log4j.FileAppender
log4j.category.org.apache.torque= ALL, org.apache.torque

torque.applicationRoot= .
torque.database.default=web2labtor
torque.database.web2labtor.adapter=oracle

#
#Conexion via JNDI produccion
torque.dsfactory.web2labtor.factory=org.apache.torque.dsfactory.JndiDataSourceFactory
torque.dsfactory.web2labtor.jndi.path=java:jdbc/Web2LabProduccion
torque.dsfactory.bookstore.jndi.java.naming.factory.initial =\org.apache.naming.java.javaURLContextFactory
torque.dsfactory.bookstore.datasource.classname =\org.apache.commons.dbcp.BasicDataSource
