<html><head><title>Choose a color</title>

<script>
function selectColor(color)
{
//alert(color)
window.opener.insertcolor_child(color);
window.close();
}

function InitColorPalette() {
  if (document.getElementsByTagName)
    var x = document.getElementsByTagName('TD');
  else if (document.all)
    var x = document.all.tags('TD');
  for (var i=0;i<x.length;i++)
  {
    x[i].onmouseover = over;
    x[i].onmouseout = out;
    x[i].onclick = click;
  }
}

function over()
{
//alert("mouseover");
this.style.border='1px dotted white';
}

function out()
{
//alert("mouseout");

this.style.border='1px solid gray';
}

function click()
{
//alert("mouseclick");

  selectColor(this.id);
}
function cleanUp()
{
window.opener.child_colors = false;
}

</script></head>
