<Title>Insert Symbol</title>
<!--This html file is used to insert other non keyboard characters.
this is called from the ShowEditor.htm file by pressing insert special characters icon.
we can select any given character and press ok. this character is pasted at the cursor position.
 -->
<script>
function selectChar(spl_char)
{
	window.opener.insertSymbolText_child(spl_char);
	window.close();
	
}


function InitColorPalette() {
  if (document.getElementsByTagName)
    var x = document.getElementsByTagName('TD');
  else if (document.all)
    var x = document.all.tags('TD');
  for (var i=0;i<x.length;i++)
  {
    x[i].onmouseover = over;
    x[i].onmouseout = out;
    x[i].onclick = click;
  }
}


function over()
{
//alert("mouseover");
this.style.border='1px dotted white';
}

function out()
{
//alert("mouseout");

this.style.border='1px solid gray';
}

function click()
{
//alert("mouseclick");

  selectChar(this.id);
}
function cleanUp()
{
//	alert("unload");
window.opener.child_SpecialSymbols = false;
}
</script></head>
