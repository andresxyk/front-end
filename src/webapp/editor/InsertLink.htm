<SCRIPT LANGUAGE=JavaScript>
var control="";
function click1()
{
  var links;
  var vArr=new Array();
  links=document.f1.link.value;

  if (links.length==0)
  {
	  window.alert("Enter URL name and press OK");
	  document.f1.link.focus();
	  return;
  }
  else
  {
	//window.returnValue = document.f1.link.value+"|"+document.f1.newwin.checked;		//return value is the selected spc. character.
	var str=document.f1.link.value+"|"+document.f1.newwin.checked;
	if(document.f1.link.value.indexOf(":/")==-1 && document.f1.link.value.indexOf("@")==-1 )
		document.f1.link.value="http://"+document.f1.link.value;

	vArr["Source"]=document.f1.link.value;
	vArr["NewWin"]=document.f1.newwin.checked;
	vArr["control"]=control;
	//alert("control="+control);
	window.opener.insertlink_child(vArr);
	window.close();
  }
}

</SCRIPT>
<SCRIPT>

function setDefaultLinkName(l_str_linkname)
{
	var link=l_str_linkname;
	for(i=0;i<document.f1.select1.length;i++)
	{
		if((document.f1.select1.options[i].text).toLowerCase()==link.toLowerCase())
		{
			document.f1.select1.selectedIndex=i;
			document.f1.link.value=link;
			break;
		}
		else
		{
			document.f1.select1.selectedIndex= 0;
		}
	}
}

function linkList(l_str_linknames)
{
	var linknames=l_str_linknames;

	var lastlink=linknames.substring(linknames.lastIndexOf(",")+1,linknames.length);
	document.write('<OPTION selected value="">--Select link--');
	if(linknames.length>0)
	{
	while(linknames.indexOf(",")>=0)
	{
		var str=linknames;
		var commaindex=linknames.indexOf(",");
		var link=linknames.substring(0,commaindex);
		linknames=linknames.substring(commaindex+1);
		document.write('<OPTION value='+link+'>'+link+'</OPTION>');
	}
	document.write('<OPTION value='+lastlink+'>'+lastlink+'</OPTION>');
	}
	if(linknames=="")
	{
		alert("Please specify the URL list.");
	}
	setDefaultLinkName(window.opener.def_link_name);
}

function setlinkName()
{

	var i=document.f1.select1.selectedIndex;
	if(document.f1.select1[i].value.indexOf("http://")==-1)
		document.f1.link.value=document.f1.select1[i].value;
	else
		document.f1.link.value=document.f1.select1[i].value;
}
function newopen()
{
	//alert("INSERT LINK="+window.opener.getText());
	var str=window.opener.getText();
	//alert(str);
	control=str.substring(str.indexOf("|")+1,str.length);
	var str1=str.substring(0,str.indexOf("|"));
	//alert(control +"      ="+str1);

}

</SCRIPT>
