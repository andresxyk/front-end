function setEditor()

	document.write('<input type="hidden" value="'+framename+'" name="hid_out_content'+dyna+'">');

	if(navigator.userAgent.indexOf("Netscape")!= -1 )
	{
		if(navigator.userAgent.indexOf("7") != -1)
		{
			document.write(editor);
			browser_type=2;
		}
		else
		{
			document.write(browser_message);
			browser_type =1;
			submit ="";
		}
	}
	else if(navigator && navigator.userAgent && navigator.userAgent.indexOf && navigator.userAgent.indexOf('Gecko') != -1)
	{
		 document.write(editor);
		 browser_type=2;
	}
	else if(navigator.userAgent.indexOf("MSIE")!= -1)
	{
		document.write(editor);
		browser_type=3;
	}
	else if(navigator.userAgent.indexOf("Opera")!= -1)
	{
		document.write(browser_message);
		browser_type =4;
		submit ="";
	}
	else
	{
		document.write(browser_message);
		browser_type =5;
		submit ="";
	}
	dyna=dyna+1;
	document.write('<input id="hid_'+framename+'" name="hid_'+framename+'" value="" type="hidden">');

}


function setContent(input_content)
{
	var str=escape(default_font);
	var default_setting='<Font face='+default_font+' size='+default_fontsize+'>';
	var input_content =default_setting+input_content;
	temp_str_cnt = input_content;
	temp_str_cnt1 = input_content;
 	var   temp_str_qt = /"/gi;  //for replacing quote
    var   temp_str_quot = "&quot;";  //for replacing quote
    var   temp_str_amp = /&/gi;  //for replacing &
    var   temp_str_amph = "&amp;";  //for replacing &amp

    temp_str_cnt1 = temp_str_cnt1.replace( temp_str_amp, temp_str_amph ); //replacing & with &amp;
    temp_str_cnt1 = temp_str_cnt1.replace( temp_str_qt, temp_str_quot ); // replacing " with &quot;
    document.form1.sendBody.value=temp_str_cnt1 ;
	document.form1.font_name.value=default_font ;
	document.form1.font_size.value=default_fontsize ;

	var str=eval("document.form1.hid_"+framename);
	str.value=temp_str_cnt1 ;
}



function finish()
{
	var css='<link rel="stylesheet" href="../dhtml/text.css" type="text/css">';
	var len=document.form1.elements.length;
	var final_content="";
	var arrIN=document.getElementsByTagName("input");

	var arrIF=document.getElementsByTagName("iframe");

	var index=0;
	var count=0;
	var ii=1;
	for(var j = 0 ; j<len  ; j++)
	{
		if(arrIN.item(j).name.indexOf('hid_out_content')>=0)
		{
			if(! getContent(eval(arrIF[index].id)) ==false)
			{
				var str=arrIF[index].id;
				arrIN.item(j).value=getContent(eval(arrIF[index].id));
				hid_out_content[count]=getContent(eval(arrIF[index].id));
				var content=eval("document.form1.hid_out_content"+ii);
				content.value=hid_out_content[count];
				final_content=final_content+hid_out_content[count]+"<BR><HR>";
				index++;
				count++;
				ii++;
			}
			else
			{
				return false;
			}
		}

	}
	if(navigator.userAgent.indexOf("MSIE")!= -1)
	{
		var url=document.frame1.cssurl;
		var csstag='<link type="text/css" rel="stylesheet" href="'+url+'">';
		document.write(csstag+final_content);
	}
	else
	{
		document.write(final_content);
	}
}

function getContent(l_obj_frame)
{
	  //for checking the html mode
	if (!l_obj_frame.isHTMLMode())
		return;
	var content1 =	"";
	if(browser_type ==3)
	{
		content1 = l_obj_frame.htmlContent();
	}
	else if(browser_type ==2)
	{
		l_obj_frame.close_child();
		content1 =	l_obj_frame.htmlContent();
	}
		return content1 ;

}
